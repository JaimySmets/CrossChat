name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open that bumps package.json, manifest.json and CHANGELOG.md from the
  # Conventional Commits on main. Merging that PR tags vX.Y.Z and creates the GitHub Release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Two packages from one build:
      #  - crosschat-vX.Y.Z.zip keeps the manifest `key`, so an unpacked install gets the pinned
      #    extension id (and with it the registered Twitch OAuth redirect).
      #  - crosschat-vX.Y.Z-webstore.zip drops `key`, which the Chrome Web Store rejects.
      - name: Package
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/crosschat-${TAG}.zip" .)
          cp -r dist webstore
          jq 'del(.key)' dist/manifest.json > webstore/manifest.json
          (cd webstore && zip -qr "../release/crosschat-${TAG}-webstore.zip" .)

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" release/*.zip --clobber

      # Skipped until the Chrome Web Store secrets are configured (see RELEASING.md).
      - name: Publish to Chrome Web Store
        if: ${{ env.CWS_REFRESH_TOKEN != '' }}
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: release/crosschat-${{ env.TAG }}-webstore.zip
          extension-id: ${{ vars.CWS_EXTENSION_ID }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
